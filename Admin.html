<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalShip Admin Panel</title>
    <style>
        :root {
            --primary-purple: #4D148C;
            --success-green: #28a745;
            --warning-yellow: #ffc107;
            --info-blue: #17a2b8;
            --light-gray: #f8f9fa;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; color: #333; }
        
        header { background: var(--primary-purple); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }

        .container { max-width: 1100px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }

        /* --- TABLE STYLING --- */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--light-gray); text-align: left; padding: 12px; border-bottom: 2px solid #dee2e6; color: var(--primary-purple); }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        /* --- STATUS BADGES --- */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-transit { background: #d1ecf1; color: #0c5460; }
        .status-delivered { background: #d4edda; color: #155724; }

        /* --- FORM STYLING --- */
        .admin-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: var(--primary-purple); color: white; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-logout { background: transparent; border: 1px solid white; color: white; padding: 5px 15px; }

        #login-form { max-width: 400px; margin: 100px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <form id="login-form">
        <h2 style="color: var(--primary-purple); text-align: center;">Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" required style="width: 100%; margin-bottom: 10px;">
        <input type="password" id="password" placeholder="Password" required style="width: 100%; margin-bottom: 20px;">
        <button type="submit" style="width: 100%;">ACCESS DASHBOARD</button>
    </form>

    <div id="admin-panel" style="display: none;">
        <header>
            <strong>GlobalShip Logistics Admin</strong>
            <button id="logout" class="btn-logout">Logout</button>
        </header>

        <div class="container">
            <h3>Quick Actions</h3>
            <div class="admin-controls">
                <div>
                    <small>Generate ID</small>
                    <button id="generate-tracking" style="width: 100%;">+ NEW SHIPMENT</button>
                </div>
                <div>
                    <small>Target Tracking #</small>
                    <input type="text" id="update-tracking" placeholder="GSXXXXXX" style="width: 100%;">
                </div>
                <div>
                    <small>Set Status</small>
                    <select id="update-status" style="width: 100%;">
                        <option value="Pending">Pending</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                </div>
                <div>
                    <small>Action</small>
                    <button id="update-shipment" style="width: 100%; background: #28a745;">UPDATE STATUS</button>
                </div>
            </div>

            <h3>Live Shipments</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tracking Number</th>
                            <th>Status</th>
                            <th>Latest Location</th>
                            <th>Created On</th>
                        </tr>
                    </thead>
                    <tbody id="shipment-table-body">
                        </tbody>
                </table>
            </div>
            <div id="list-loading" style="text-align: center; padding: 20px;">Syncing with database...</div>
        </div>
    </div>

    <script type="module">
        // --- KEEP YOUR EXISTING FIREBASE INITIALIZATION AND AUTH LOGIC ---

        // Update the loadShipments function to handle the table and badges
        function loadShipments() {
            const tableBody = document.getElementById('shipment-table-body');
            const loading = document.getElementById('list-loading');

            onSnapshot(collection(db, 'shipments'), (snapshot) => {
                tableBody.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const s = docSnap.data();
                    const statusClass = s.status === 'Pending' ? 'status-pending' : 
                                      s.status === 'In Transit' ? 'status-transit' : 'status-delivered';
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${docSnap.id}</strong></td>
                        <td><span class="badge ${statusClass}">${s.status}</span></td>
                        <td>${s.locationHistory && s.locationHistory.length > 0 ? s.locationHistory[s.locationHistory.length - 1] : 'N/A'}</td>
                        <td><small>${new Date().toLocaleDateString()}</small></td>
                    `;
                    tableBody.appendChild(row);
                });
                loading.style.display = 'none';
            });
        }
    </script>
</body>
</html>
