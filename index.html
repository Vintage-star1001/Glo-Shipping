<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalShip Logistics - Home</title>
    <style>
        :root {
            --primary-purple: #4D148C;
            --primary-orange: #FF6200;
            --white: #ffffff;
            --gray-bg: #f4f4f4;
        }

        body { font-family: 'Roboto', Arial, sans-serif; margin:0; padding:0; background: var(--gray-bg); color:#333; overflow-x: hidden; }

        /* --- STICKY HEADER --- */
        header { 
            background: var(--primary-purple); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            height: 60px;
        }
        
        .hamburger { cursor: pointer; font-size: 24px; padding: 10px; }

        /* --- OFF-CANVAS MENU --- */
        #side-menu {
            position: fixed;
            top: 0; right: -300px;
            width: 300px; height: 100%;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            transition: 0.3s ease;
            z-index: 2000;
            padding-top: 60px;
        }
        #side-menu.active { right: 0; }
        #side-menu a, #side-menu button {
            display: block;
            padding: 15px 25px;
            text-decoration: none;
            color: var(--primary-purple);
            font-weight: bold;
            border-bottom: 1px solid #eee;
            width: 100%; text-align: left; background: none; border-left: none; border-right: none;
        }

        /* --- HERO & QUICK ACTIONS --- */
        .hero-banner {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200');
            background-size: cover; background-position: center;
            height: 300px; display: flex; align-items: center; justify-content: center;
            color: white; text-align: center; font-size: 2rem; font-weight: bold;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-top: -50px; /* Overlaps the hero */
            padding: 0 10px;
            gap: 5px;
            max-width: 900px; margin-left: auto; margin-right: auto;
        }
        .action-card {
            background: white; padding: 20px 10px;
            text-align: center; border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            color: var(--primary-purple); cursor: pointer;
            transition: 0.2s;
        }
        .action-card.active { background: var(--primary-purple); color: white; }
        .action-card i { display: block; font-size: 24px; margin-bottom: 10px; }

        /* --- TRACKING BAR --- */
        .tracking-container {
            max-width: 900px; margin: 30px auto;
            display: flex; background: white;
            border: 1px solid #ddd;
        }
        .tracking-container input { border: none; padding: 20px; flex-grow: 1; font-size: 16px; outline: none; }
        .tracking-container button { 
            width: 150px; background: var(--primary-orange); 
            color: white; border: none; font-weight: bold; 
            text-transform: uppercase; margin: 0; border-radius: 0;
        }

        /* --- MODALS --- */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:3000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:8px; width:90%; max-width:460px; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 20px; font-weight: bold;">GlobalShip</div>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </header>

    <div id="side-menu">
        <a href="#" onclick="toggleMenu()">✖ Close</a>
        <button id="menu-signup">Sign Up</button>
        <button id="menu-login">Login</button>
        <button onclick="logoutUser()">Logout</button>
    </div>

    <section id="public-content">
        <div class="hero-banner">Ship, manage, track, deliver.</div>

        <div class="quick-actions">
            <div class="action-card" onclick="alert('Rate Tool Coming Soon')">📦<br>RATE & SHIP</div>
            <div class="action-card active">🔍<br>TRACK</div>
            <div class="action-card" onclick="alert('Location Tool Coming Soon')">📍<br>LOCATIONS</div>
        </div>

        <div class="tracking-container">
            <input type="text" id="tracking-number" placeholder="TRACKING ID">
            <button id="btn-track-main">TRACK ➔</button>
        </div>
        
        <div id="tracking-result" style="display:none; max-width:900px; margin: 0 auto; background:white; padding: 20px;">
            <h3 id="status"></h3>
            <ul id="location-history"></ul>
        </div>
    </section>

    <div id="user-dashboard" style="display:none; padding:20px;">
        </div>

    <script type="module">
        // --- YOUR EXISTING FIREBASE LOGIC HERE ---
        // (Include your Firebase config and auth scripts from original file)

        window.toggleMenu = () => {
            document.getElementById('side-menu').classList.toggle('active');
        };

        // Connect the new UI buttons to your existing logic
        document.getElementById('btn-track-main').addEventListener('click', () => {
            const num = document.getElementById('tracking-number').value.trim();
            // Trigger your existing tracking logic here
            alert("Searching for: " + num);
        });
    </script>
</body>
</html>
